<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="100%" stop-color="#0d140f" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#p3Grad)" />
  
  <!-- Ventana de aplicación de tareas Kanban -->
  <rect x="40" y="30" width="520" height="300" rx="10" fill="#0b1120" stroke="#334155" stroke-width="1.5" />
  <rect x="40" y="30" width="520" height="36" rx="10" fill="#1e293b" />
  <circle cx="65" cy="48" r="5" fill="#f43f5e" />
  <circle cx="82" cy="48" r="5" fill="#facc15" />
  <circle cx="99" cy="48" r="5" fill="#22c55e" />
  <rect x="130" y="40" width="220" height="16" rx="4" fill="#0f172a" />

  <!-- 3 Columnas de tablero Kanban -->
  <!-- Columna 1: Pendiente -->
  <g transform="translate(60, 80)">
    <rect width="145" height="235" rx="6" fill="#1e293b" opacity="0.7" />
    <rect x="10" y="12" width="70" height="10" rx="3" fill="#94a3b8" />
    <rect x="10" y="32" width="125" height="48" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <rect x="20" y="44" width="90" height="6" rx="3" fill="#f1f5f9" />
    <rect x="20" y="58" width="40" height="8" rx="2" fill="#f43f5e" opacity="0.8" />

    <rect x="10" y="90" width="125" height="52" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <rect x="20" y="102" width="80" height="6" rx="3" fill="#f1f5f9" />
    <rect x="20" y="116" width="35" height="8" rx="2" fill="#38bdf8" opacity="0.8" />
  </g>

  <!-- Columna 2: En Progreso -->
  <g transform="translate(225, 80)">
    <rect width="145" height="235" rx="6" fill="#1e293b" opacity="0.7" />
    <rect x="10" y="12" width="85" height="10" rx="3" fill="#38bdf8" />
    <rect x="10" y="32" width="125" height="56" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <rect x="20" y="44" width="95" height="6" rx="3" fill="#f1f5f9" />
    <rect x="20" y="56" width="60" height="6" rx="3" fill="#64748b" />
    <rect x="20" y="70" width="45" height="8" rx="2" fill="#818cf8" opacity="0.8" />

    <rect x="10" y="98" width="125" height="48" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <rect x="20" y="110" width="75" height="6" rx="3" fill="#f1f5f9" />
    <rect x="20" y="124" width="40" height="8" rx="2" fill="#facc15" opacity="0.8" />
  </g>

  <!-- Columna 3: Completado -->
  <g transform="translate(390, 80)">
    <rect width="145" height="235" rx="6" fill="#1e293b" opacity="0.7" />
    <rect x="10" y="12" width="75" height="10" rx="3" fill="#22c55e" />
    <rect x="10" y="32" width="125" height="48" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <rect x="20" y="44" width="85" height="6" rx="3" fill="#f1f5f9" />
    <rect x="20" y="58" width="45" height="8" rx="2" fill="#22c55e" opacity="0.8" />

    <rect x="10" y="90" width="125" height="48" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <rect x="20" y="102" width="70" height="6" rx="3" fill="#f1f5f9" />
    <rect x="20" y="116" width="35" height="8" rx="2" fill="#22c55e" opacity="0.8" />
  </g>
</svg>

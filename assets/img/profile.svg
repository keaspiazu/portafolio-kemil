<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="50%" stop-color="#0b140e" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="collarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8d5b8" />
      <stop offset="100%" stop-color="#e2ab83" />
    </linearGradient>
  </defs>

  <!-- Fondo circular con borde tecnológico -->
  <circle cx="200" cy="200" r="195" fill="url(#bgGrad)" stroke="url(#primaryGrad)" stroke-width="4"/>
  
  <!-- Círculos de tecnología sutiles de fondo -->
  <circle cx="90" cy="110" r="22" fill="#38bdf8" opacity="0.15" />
  <circle cx="310" cy="110" r="18" fill="#818cf8" opacity="0.15" />
  <circle cx="320" cy="290" r="28" fill="#38bdf8" opacity="0.12" />
  <circle cx="80" cy="290" r="20" fill="#818cf8" opacity="0.12" />

  <!-- Símbolos flotantes de tecnología -->
  <text x="60" y="195" fill="#38bdf8" font-family="monospace" font-size="24" font-weight="bold" opacity="0.6">&lt;/&gt;</text>
  <text x="295" y="210" fill="#818cf8" font-family="monospace" font-size="26" font-weight="bold" opacity="0.6">{ ; }</text>

  <!-- Torso / Camisa celeste con cuello (como en la foto del CV) -->
  <path d="M100,350 C100,270 140,250 200,250 C260,250 300,270 300,350 Z" fill="url(#shirtGrad)" />
  
  <!-- Cuello de camisa abierta en 'V' -->
  <path d="M175,250 L200,285 L225,250 Z" fill="#ffffff" opacity="0.9" />
  <path d="M165,250 L188,278 L200,255 Z" fill="url(#collarGrad)" />
  <path d="M235,250 L212,278 L200,255 Z" fill="url(#collarGrad)" />

  <!-- Cuello anatómico -->
  <rect x="180" y="195" width="40" height="45" rx="8" fill="url(#skinGrad)" />

  <!-- Rostro / Cabeza -->
  <ellipse cx="200" cy="160" rx="55" ry="62" fill="url(#skinGrad)" />

  <!-- Orejas -->
  <ellipse cx="143" cy="165" rx="9" ry="15" fill="url(#skinGrad)" />
  <ellipse cx="257" cy="165" rx="9" ry="15" fill="url(#skinGrad)" />

  <!-- Cabello negro corto peinado hacia arriba/lado (fiel a la foto) -->
  <path d="M142,160 C140,95 185,92 200,92 C215,92 260,95 258,160 C250,135 235,120 200,120 C165,120 150,135 142,160 Z" fill="#1e1b18" />
  <path d="M175,98 Q200,88 225,98" stroke="#1e1b18" stroke-width="8" stroke-linecap="round" fill="none" />

  <!-- Cejas oscuras definidas -->
  <path d="M162,142 Q175,138 186,143" fill="none" stroke="#1e1b18" stroke-width="3.5" stroke-linecap="round" />
  <path d="M214,143 Q225,138 238,142" fill="none" stroke="#1e1b18" stroke-width="3.5" stroke-linecap="round" />

  <!-- Ojos -->
  <ellipse cx="174" cy="153" rx="7" ry="5" fill="#ffffff" />
  <circle cx="174" cy="153" r="3.5" fill="#261b14" />
  <circle cx="175.5" cy="151.5" r="1.2" fill="#ffffff" />

  <ellipse cx="226" cy="153" rx="7" ry="5" fill="#ffffff" />
  <circle cx="226" cy="153" r="3.5" fill="#261b14" />
  <circle cx="227.5" cy="151.5" r="1.2" fill="#ffffff" />

  <!-- Nariz -->
  <path d="M198,155 L196,173 Q200,177 204,173" fill="none" stroke="#c98a63" stroke-width="2" stroke-linecap="round" />

  <!-- Boca / Expresión cordial -->
  <path d="M188,193 Q200,200 212,193" fill="none" stroke="#a05c3b" stroke-width="2.5" stroke-linecap="round" />
</svg>
